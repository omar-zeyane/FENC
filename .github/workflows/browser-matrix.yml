name: Cross-browser FENC validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'tests/fenc_browser_matrix.mjs'
      - '.github/workflows/browser-matrix.yml'

permissions:
  contents: write

jobs:
  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install pinned Playwright
        run: npm install --no-save playwright@1.55.0

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Validate Chromium
        continue-on-error: true
        run: node tests/fenc_browser_matrix.mjs index.html chromium

      - name: Validate Firefox
        continue-on-error: true
        run: node tests/fenc_browser_matrix.mjs index.html firefox

      - name: Validate WebKit
        continue-on-error: true
        run: node tests/fenc_browser_matrix.mjs index.html webkit

      - name: Persist browser reports
        if: always()
        run: |
          mkdir -p tests
          cp -f FENC_Browser_*_Report.txt tests/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- tests/FENC_Browser_*_Report.txt; then
            echo "No browser report changes to commit"
          else
            git add tests/FENC_Browser_*_Report.txt
            git commit -m "Publish cross-browser validation reports"
            git push
          fi

      - name: Require complete passing matrix
        if: always()
        run: |
          test -f tests/FENC_Browser_chromium_Report.txt
          test -f tests/FENC_Browser_firefox_Report.txt
          test -f tests/FENC_Browser_webkit_Report.txt
          grep -F "Result: 14/14 passed" tests/FENC_Browser_chromium_Report.txt
          grep -F "Result: 14/14 passed" tests/FENC_Browser_firefox_Report.txt
          grep -F "Result: 14/14 passed" tests/FENC_Browser_webkit_Report.txt
