# Final critique-hardened artifact validation
name: Validate FENC research artifact

on:
  push:
    paths:
      - 'index.html'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/finalize-artifact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Apply final artifact hardening
        shell: bash
        run: |
          set -euo pipefail
          cur="$(sha256sum index.html | awk '{print $1}')"
          guarded="2c1e0b679f412a4d8f68aae3a097188b8bae729d43c0773df7069ca511e46de9"
          final="0860c6cdad4c48232e5318b6c9003ea70ed2db8165680db836e893adbe8b3fdb"
          if [ "$cur" = "$guarded" ]; then
            patch index.html < tools/critique-hardening.patch
          elif [ "$cur" = "$final" ]; then
            echo "index.html already critique-hardened"
          else
            echo "Unexpected index.html SHA-256: $cur" >&2
            exit 1
          fi

      - name: Verify frozen artifact hash
        run: echo "0860c6cdad4c48232e5318b6c9003ea70ed2db8165680db836e893adbe8b3fdb  index.html" | sha256sum -c -

      - name: Run baseline reproducibility harness
        run: node tests/fenc_regression_harness.js index.html

      - name: Run edge-case validation
        run: node tests/fenc_edge_validation.js index.html

      - name: Run parser mutation fuzzing
        run: node tests/fenc_parser_fuzz.js index.html 10000

      - name: Run real browser-engine matrix
        shell: bash
        run: |
          set +e
          mkdir -p reports
          diag="reports/FENC_Browser_CI_Diagnostics.txt"
          : > "$diag"
          echo "Playwright package: 1.55.0" >> "$diag"
          echo "Node: $(node --version)" >> "$diag"
          npm install --no-save playwright@1.55.0 >> "$diag" 2>&1
          npm_rc=$?
          echo "npm_install_rc=$npm_rc" >> "$diag"
          if [ "$npm_rc" -eq 0 ]; then
            npx playwright install --with-deps chromium firefox webkit >> "$diag" 2>&1
            install_rc=$?
          else
            install_rc=99
          fi
          echo "playwright_browser_install_rc=$install_rc" >> "$diag"
          for browser in chromium firefox webkit; do
            if [ "$npm_rc" -eq 0 ] && [ "$install_rc" -eq 0 ]; then
              node tests/fenc_browser_matrix.mjs index.html "$browser" >> "$diag" 2>&1
              rc=$?
            else
              rc=98
            fi
            echo "${browser}_validation_rc=$rc" >> "$diag"
            if [ -f "FENC_Browser_${browser}_Report.txt" ]; then
              cp -f "FENC_Browser_${browser}_Report.txt" reports/
            fi
          done
          exit 0

      - name: Publish browser validation evidence
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/FENC_Browser_*.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No browser evidence changes to commit"
          else
            git commit -m "Publish cross-browser validation evidence"
            git push
          fi

      - name: Require complete passing browser matrix
        if: always()
        shell: bash
        run: |
          test -f reports/FENC_Browser_chromium_Report.txt
          test -f reports/FENC_Browser_firefox_Report.txt
          test -f reports/FENC_Browser_webkit_Report.txt
          grep -F "Result: 14/14 passed" reports/FENC_Browser_chromium_Report.txt
          grep -F "Result: 14/14 passed" reports/FENC_Browser_firefox_Report.txt
          grep -F "Result: 14/14 passed" reports/FENC_Browser_webkit_Report.txt

      - name: Commit hardened index artifact if required
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply critique hardening to final research artifact"
          git push
