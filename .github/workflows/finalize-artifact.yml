name: Finalize FENC research artifact

on:
  push:
    paths:
      - 'tools/apply_chunk_guard.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final chunk-counter guard
        run: python3 tools/apply_chunk_guard.py index.html

      - name: Verify final artifact hash
        run: echo "2c1e0b679f412a4d8f68aae3a097188b8bae729d43c0773df7069ca511e46de9  index.html" | sha256sum -c -

      - name: Run reproducibility harness
        run: node tests/fenc_regression_harness.js index.html

      - name: Commit final index artifact
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enforce chunk-counter guard in final research artifact"
          git push
